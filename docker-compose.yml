services:
  db:
    image:  postgres:16-alpine
    container_name: project_database
    restart:  unless-stopped
    environment:
      POSTGRES_USER:  ${DB_USER}
      POSTGRES_PASSWORD:  ${DB_PASSWORD}
      POSTGRESS_DB: ${DB_NAME}
    ports:
    - "5432:5432"
    volumes:
    - "/var/lib/postgresql/data"
volumes:
  db_data: